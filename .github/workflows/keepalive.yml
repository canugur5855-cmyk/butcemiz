# Supabase ücretsiz planı 7 gün istek gelmeyen projeyi duraklatır.
# Bu iş 2 günde bir veritabanına küçük bir sorgu atarak projeyi uyanık tutar.
# (Public anahtar zaten config.js'te herkese açık; RLS yüzünden sorgu boş döner, bu yeterli.)
name: Supabase uyanık tut

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase'e sorgu at
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" config.js)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/rates?select=code&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          test "$code" = 200
